# Aerea-Nexus Fractal Application Package Manifest
api_version = "nexus.app/v1"
id = "erp"
name = "ERP Operations & Procurement"
version = "0.1.0"
category = "Apps"
route = "/erp"
entry = "index.html"
icon = "material-symbols-light:precision-manufacturing-outline"
