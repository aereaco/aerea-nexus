<!-- 4. PROFILE & IAM TAB -->
<div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto p-3"
  data-show="headerDropdownTab === 'profile'"
  data-signal="{ loginUser: '', loginPass: '' }">

  <!-- Authenticated Identity Card -->
  <div data-show="$auth.isAuthenticated" class="space-y-3">
    <div class="flex items-center gap-3 p-2.5 bg-base-200/60 rounded-xl border border-base-300">
      <div class="avatar online placeholder">
        <div
          class="w-11 rounded-full bg-primary/15 text-primary ring ring-primary ring-offset-base-100 ring-offset-2 flex items-center justify-center">
          <iconify-icon icon="material-symbols-light:verified-user-outline" class="text-2xl"></iconify-icon>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-sm truncate" id="iam-profile-actor" data-bind="$auth.actor || 'Authenticated User'"></div>
        <div class="text-[11px] opacity-60 truncate" data-bind="'Scope: ' + ($auth.level || 'database')"></div>
        <div class="flex flex-wrap gap-1 mt-1">
          <template data-for="role in ($auth.roles || [])">
            <span class="badge badge-primary badge-xs" data-bind="role"></span>
          </template>
        </div>
      </div>
    </div>

    <!-- Verified Server Capabilities -->
    <div class="px-2 py-2 rounded-lg bg-base-200/40 border border-base-300/60">
      <div class="text-[10px] font-semibold uppercase tracking-wider opacity-60 mb-1">IAM Capabilities (Server-Verified)</div>
      <div class="flex flex-wrap gap-1" id="iam-profile-caps">
        <template data-for="cap in ($auth.capabilities || [])">
          <span class="badge badge-ghost badge-xs font-mono text-[10px]" data-bind="cap"></span>
        </template>
      </div>
    </div>

    <ul class="menu menu-sm p-0 space-y-0.5 text-xs">
      <li><a data-on-click="activeSidebarTab = 2; headerDropdownOpen = false"><iconify-icon
            icon="material-symbols-light:star-outline" class="text-base"></iconify-icon>Bookmarks &amp; Favorites</a>
      </li>
      <li><a data-on-click="openSession('session-erp'); headerDropdownOpen = false"><iconify-icon
            icon="material-symbols-light:groups" class="text-base"></iconify-icon>Open Executive ERP Chat</a>
      </li>
      <li data-show="$auth.hasRole('OWNER')"><a data-on-click="router.navigate('/iam'); headerDropdownOpen = false"><iconify-icon
            icon="material-symbols-light:admin-panel-settings-outline" class="text-base"></iconify-icon>Users &amp; Groups (IAM)</a>
      </li>
      <div class="divider my-1"></div>
      <li><a id="iam-signout-btn" class="text-error hover:bg-error/10"
          data-on-click="$auth.signout().then(() => { notify('Signed Out', 'IAM session cleared', 'info'); headerDropdownOpen = false; })"><iconify-icon
            icon="material-symbols-light:logout" class="text-base"></iconify-icon>Sign Out</a></li>
    </ul>
  </div>

  <!-- First-Run Workspace Admin Setup (only when DB has zero users) -->
  <div data-show="!$auth.isAuthenticated && $auth.initialized === false" class="space-y-3">
    <div class="flex items-center gap-3 p-2.5 bg-primary/10 rounded-xl border border-primary/20">
      <div class="avatar placeholder">
        <div class="w-10 rounded-full bg-primary/20 text-primary flex items-center justify-center">
          <iconify-icon icon="material-symbols-light:admin-panel-settings-outline" class="text-xl"></iconify-icon>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-sm truncate">First-Run Setup</div>
        <div class="text-[11px] opacity-70 truncate">Create initial OWNER admin</div>
      </div>
    </div>

    <div data-show="$auth.error" id="iam-setup-error"
      class="alert alert-error py-2 px-3 text-xs rounded-lg">
      <span data-bind="$auth.error"></span>
    </div>

    <form class="space-y-2"
      data-on-submit_prevent="$auth.bootstrap({ user: loginUser, pass: loginPass }).then(ok => { if (ok) { loginPass = ''; notify('Workspace Initialized', 'Signed in as ' + $auth.actor + ' (OWNER)', 'success'); } })">
      <label class="form-control w-full">
        <span class="label-text text-xs opacity-70 mb-1">Admin Username</span>
        <input id="iam-setup-user" name="setup_username" type="text" autocomplete="username"
          class="input input-bordered input-sm w-full" placeholder="e.g. director"
          data-bind-value="loginUser" />
      </label>
      <label class="form-control w-full">
        <span class="label-text text-xs opacity-70 mb-1">Admin Password</span>
        <input id="iam-setup-pass" name="setup_password" type="password" autocomplete="new-password"
          class="input input-bordered input-sm w-full" placeholder="Min 4 characters"
          data-bind-value="loginPass" />
      </label>
      <button id="iam-setup-submit" type="submit" class="btn btn-primary btn-sm w-full"
        data-bind-disabled="$auth.loading">
        <span data-show="!$auth.loading">Create Workspace Admin</span>
        <span data-show="$auth.loading">Initializing…</span>
      </button>
    </form>
  </div>

  <!-- Anonymous / Sign In Form -->
  <div data-show="!$auth.isAuthenticated && $auth.initialized !== false" class="space-y-3">
    <div class="flex items-center gap-3 p-2.5 bg-base-200/50 rounded-xl">
      <div class="avatar placeholder">
        <div class="w-10 rounded-full bg-base-300 text-base-content/70 flex items-center justify-center">
          <iconify-icon icon="material-symbols-light:lock-outline" class="text-xl"></iconify-icon>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-sm truncate">Guest Session</div>
        <div class="text-[11px] opacity-60 truncate">Sign in with Nexus-IO IAM</div>
      </div>
    </div>

    <div data-show="$auth.error" id="iam-login-error"
      class="alert alert-error py-2 px-3 text-xs rounded-lg">
      <span data-bind="$auth.error"></span>
    </div>

    <form class="space-y-2"
      data-on-submit_prevent="$auth.signin({ user: loginUser, pass: loginPass }).then(ok => { if (ok) { loginPass = ''; notify('Signed In', 'Authenticated as ' + $auth.actor + ' (' + ($auth.roles || []).join(', ') + ')', 'success'); } })">
      <label class="form-control w-full">
        <span class="label-text text-xs opacity-70 mb-1">Username</span>
        <input id="iam-login-user" name="username" type="text" autocomplete="username"
          class="input input-bordered input-sm w-full" placeholder="e.g. director or auditor"
          data-bind-value="loginUser" />
      </label>
      <label class="form-control w-full">
        <span class="label-text text-xs opacity-70 mb-1">Password</span>
        <input id="iam-login-pass" name="password" type="password" autocomplete="current-password"
          class="input input-bordered input-sm w-full" placeholder="Password"
          data-bind-value="loginPass" />
      </label>
      <button id="iam-login-submit" type="submit" class="btn btn-primary btn-sm w-full"
        data-bind-disabled="$auth.loading">
        <span data-show="!$auth.loading">Sign In</span>
        <span data-show="$auth.loading">Signing In…</span>
      </button>
    </form>
  </div>
</div>
