<!-- ================= Right-Side Collaborative Chatbar ================= -->
<aside id="chatbar-container"
  data-signal_global="{
    chatbarOpen: false,
    chatbarDocked: localStorage.chatbarDocked === 'true',
    chatFabOpen: false,
    activeSessionId: 'session-erp',
    chatInputText: '',
    erpConnected: false,
    erpConnecting: false,
    erpSyncedActor: null,
    erpPoLive: null,
    erpMsgLive: null,
    chatSessions: [
      {
        id: 'session-erp',
        name: 'Executive ERP & Strategy',
        icon: 'material-symbols-light:groups',
        unread: 1,
        pinned: true,
        type: 'group',
        description: 'Quarterly review & vendor approvals',
        members: [
          { name: 'Vernon', role: 'Managing Director', isAgent: false },
          { name: 'Finance Agent', role: 'Autonomous AI', isAgent: true, icon: 'material-symbols-light:finance-mode' },
          { name: 'Sarah Chen', role: 'VP Operations', isAgent: false }
        ]
      },
      {
        id: 'session-copilot',
        name: 'Nexus AI Copilot',
        icon: 'material-symbols-light:smart-toy-outline',
        unread: 0,
        pinned: true,
        type: 'agent',
        description: 'Framework assistant & runtime diagnostics',
        members: [
          { name: 'Nexus Copilot', role: 'System Orchestrator', isAgent: true }
        ]
      },
      {
        id: 'session-supply',
        name: 'Supply Chain & Logistics',
        icon: 'material-symbols-light:local-shipping-outline',
        unread: 0,
        pinned: false,
        type: 'group',
        description: 'Live inventory tracking & delivery queues',
        members: [
          { name: 'Logistics Bot', role: 'Inventory Monitor', isAgent: true },
          { name: 'Marcus Miller', role: 'Procurement Manager', isAgent: false }
        ]
      }
    ],
    chatMessages: {
      'session-erp': [
        {
          id: 'msg-1',
          sender: 'Vernon',
          isAgent: false,
          time: '10:14 AM',
          text: '@Finance Agent could you pull the Q3 supplier variances and prepare a purchase order draft?'
        },
        {
          id: 'msg-2',
          sender: 'Finance Agent',
          isAgent: true,
          time: '10:15 AM',
          text: 'Analyzing recent inventory runs across Tier 1 suppliers. Here is the generated PO draft for review:',
          artifact: {
            type: 'invoice_draft',
            title: 'PO #2026-Q3-088 (Acme Industrial Logistics)',
            amount: '$14,250.00',
            status: 'Pending Review',
            items: [
              { sku: 'NEX-884', desc: 'Hydraulic Actuators', qty: 20, cost: '$8,400.00' },
              { sku: 'NEX-102', desc: 'Telemetry Sensor Pack', qty: 50, cost: '$5,850.00' }
            ]
          }
        },
        {
          id: 'msg-3',
          sender: 'Sarah Chen',
          isAgent: false,
          time: '10:18 AM',
          text: 'Looks solid. Approved the actuator count based on our current Kanban queue in the drag module.'
        }
      ],
      'session-copilot': [
        {
          id: 'cp-1',
          sender: 'Nexus Copilot',
          isAgent: true,
          time: '09:00 AM',
          text: 'Good morning! All 14 framework pages and declarative runtime directives are running at Tier 3 quad-threaded capacity. Ready for queries or code synthesis.'
        }
      ],
      'session-supply': [
        {
          id: 'sp-1',
          sender: 'Logistics Bot',
          isAgent: true,
          time: 'Yesterday',
          text: 'Alert: Stock replenishment triggered for Sensor Packs. Delivery ETA: Tomorrow 08:00.'
        },
        {
          id: 'sp-2',
          sender: 'Marcus Miller',
          isAgent: false,
          time: 'Yesterday',
          text: 'Acknowledged, warehouse bay 3 prepared.'
        }
      ]
    },
    getActiveSession: () => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      const id = g.activeSessionId || 'session-erp';
      return (g.chatSessions || []).find(s => s.id === id) || (g.chatSessions || [])[0] || {};
    },
    getActiveMessages: () => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      const id = g.activeSessionId || 'session-erp';
      if (id === 'session-erp' && g.erpConnected && g.erpMsgLive && Array.isArray(g.erpMsgLive.data) && g.erpMsgLive.data.length > 0) {
        const poList = (g.erpPoLive && Array.isArray(g.erpPoLive.data)) ? g.erpPoLive.data : [];
        return [...g.erpMsgLive.data]
          .sort((a, b) => Number(a.seq || a.created_at || 0) - Number(b.seq || b.created_at || 0))
          .map(m => {
            if (!m.po_id) return m;
            const livePo = poList.find(p => p.id === m.po_id || p.po_key === m.po_id);
            if (!livePo) return m;
            return {
              ...m,
              artifact: {
                ...(m.artifact || {}),
                id: livePo.id,
                type: 'invoice_draft',
                title: livePo.title || m.artifact?.title,
                amount: livePo.amount || m.artifact?.amount,
                status: livePo.status || m.artifact?.status || 'Pending Review',
                approved_by: livePo.approved_by || null,
                approved_at: livePo.approved_at || null,
                receipt_path: livePo.receipt_path || null,
                attachments: Array.isArray(livePo.attachments) ? livePo.attachments : [],
                items: Array.isArray(livePo.items) ? livePo.items : (m.artifact?.items || [])
              }
            };
          });
      }
      return (g.chatMessages || {})[id] || [];
    },
    disconnectErpLive: async () => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      const handles = [g.erpPoLive, g.erpMsgLive].filter(Boolean);
      g.erpPoLive = null;
      g.erpMsgLive = null;
      g.erpConnected = false;
      g.erpSyncedActor = null;
      for (const h of handles) {
        try { if (typeof h.unsubscribe === 'function') await h.unsubscribe(); } catch (_) {}
      }
    },
    connectErpLive: async (sqlFn, actor) => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      if (!sqlFn || !actor) return;
      if (g.erpConnecting || (g.erpConnected && g.erpSyncedActor === actor)) return;
      g.erpConnecting = true;
      try {
        await g.disconnectErpLive();
        const poLive = await sqlFn('LIVE SELECT * FROM erp_po');
        const msgLive = await sqlFn('LIVE SELECT * FROM erp_message');
        g.erpPoLive = poLive;
        g.erpMsgLive = msgLive;
        g.erpSyncedActor = actor;
        g.erpConnected = true;
      } catch (err) {
        g.erpConnected = false;
        g.erpSyncedActor = null;
      } finally {
        g.erpConnecting = false;
      }
    },
    approvePo: async (poId, sqlFn, actor) => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      if (!g.erpConnected || !sqlFn) {
        if (typeof g.notify === 'function') g.notify('PO Approved (Local)', 'Sign in to persist approval in Nexus-DB', 'info');
        return;
      }
      const targetId = poId || 'erp_po:po_088';
      // 1. Prefer executing approval through the stateful Wasmtime cell (/cells/erp/po-workflow)
      try {
        const cellRes = await window.fetch('/cells/erp/po-workflow', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ po_id: targetId, actor: actor || 'unknown' })
        });
        if (cellRes.ok) {
          const cellJson = await cellRes.json().catch(() => null);
          if (cellJson && cellJson.ok) {
            if (typeof g.notify === 'function') {
              g.notify('PO Approved via Wasm Cell', targetId + ' approved in Wasmtime & receipt saved to S3', 'success');
            }
            return;
          }
          if (cellJson && cellJson.error) {
            if (typeof g.notify === 'function') {
              g.notify('Approval Rejected by Wasm Sandbox', cellJson.error, 'error');
            }
            return;
          }
        }
      } catch (_) {
        // Cell not deployed yet — fall back to direct Nexus-DB SQL update
      }
      // 2. Fallback: direct Nexus-DB SQL update (still enforced by server RBAC)
      try {
        await sqlFn(
          'UPDATE ' + targetId + ' SET status = $status, approved_by = $actor, approved_at = $at;',
          { status: 'Approved', actor: actor || 'unknown', at: new window.Date().toISOString() }
        );
        if (typeof g.notify === 'function') {
          g.notify('PO Approved', targetId + ' approved and persisted in Nexus-DB', 'success');
        }
      } catch (err) {
        if (typeof g.notify === 'function') {
          g.notify('Approval Rejected by Server', (err && err.message) ? err.message : 'Insufficient IAM permissions', 'error');
        }
      }
    },
    uploadPoAttachment: async (poId, fileInput, sqlFn, actor) => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      const file = fileInput && fileInput.files && fileInput.files[0];
      if (!file) return;
      const targetId = poId || 'erp_po:po_088';
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const s3Path = '/s3/erp-attachments/po_088/' + safeName;
      try {
        const putRes = await window.fetch(s3Path, {
          method: 'PUT',
          credentials: 'same-origin',
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
          body: file
        });
        if (!putRes.ok) {
          const msg = await putRes.text().catch(() => 'Upload failed');
          if (typeof g.notify === 'function') g.notify('Upload Rejected', msg, 'error');
          return;
        }
        const etag = (putRes.headers.get('etag') || '').replace(/\x22/g, '');
        const existingPo = (g.erpPoLive && Array.isArray(g.erpPoLive.data))
          ? g.erpPoLive.data.find(p => p.id === targetId || p.po_key === targetId)
          : null;
        const prev = Array.isArray(existingPo?.attachments) ? existingPo.attachments : [];
        const next = [...prev.filter(a => a.path !== s3Path), {
          name: safeName,
          path: s3Path,
          size: file.size,
          etag: etag,
          uploaded_by: actor || 'unknown'
        }];
        if (typeof sqlFn === 'function') {
          await sqlFn('UPDATE ' + targetId + ' SET attachments = $atts;', { atts: next });
        }
        if (typeof g.notify === 'function') {
          g.notify('Attachment Uploaded', safeName + ' stored in Nexus-IO S3', 'success');
        }
      } catch (err) {
        if (typeof g.notify === 'function') {
          g.notify('Upload Error', (err && err.message) ? err.message : 'Failed to upload file', 'error');
        }
      } finally {
        if (fileInput) fileInput.value = '';
      }
    },
    openSession: (id) => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      g.activeSessionId = id;
      g.chatbarOpen = true;
      g.chatFabOpen = false;
      const sess = (g.chatSessions || []).find(s => s.id === id);
      if (sess && sess.unread > 0) sess.unread = 0;
    },
    closeChatbar: () => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      g.chatbarOpen = false;
    },
    toggleChatDock: () => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      g.chatbarDocked = !g.chatbarDocked;
      localStorage.setItem('chatbarDocked', g.chatbarDocked);
    },
    togglePinSession: (id) => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      g.chatSessions = (g.chatSessions || []).map(s => s.id === id ? { ...s, pinned: !s.pinned } : s);
    },
    closeChatSession: (id) => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      const remaining = (g.chatSessions || []).filter(s => s.id !== id);
      g.chatSessions = remaining;
      if (g.activeSessionId === id) {
        if (remaining.length > 0) {
          g.activeSessionId = remaining[0].id;
        } else {
          g.chatbarOpen = false;
          g.activeSessionId = null;
        }
      }
    },
    createChatSession: () => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      const newId = 'session-' + window.Date.now();
      const count = (g.chatSessions || []).length + 1;
      const newSession = {
        id: newId,
        name: 'Project Space #' + count,
        icon: 'material-symbols-light:chat-bubble-outline',
        pinned: false,
        unread: 0,
        type: 'group',
        description: 'Collaborative enterprise channel',
        members: [
          { name: 'Vernon', role: 'Owner', isAgent: false },
          { name: 'Nexus Copilot', role: 'AI Agent', isAgent: true }
        ]
      };
      g.chatSessions = [...(g.chatSessions || []), newSession];
      g.chatMessages = {
        ...g.chatMessages,
        [newId]: [
          {
            id: 'msg-' + window.Date.now(),
            sender: 'Nexus Copilot',
            isAgent: true,
            time: new window.Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            text: 'Welcome to this new collaboration space! Mention @Nexus Copilot or any agent to get started.'
          }
        ]
      };
      g.openSession(newId);
    },
    sendChatMessage: async (sqlFn, actor) => {
      const g = window.UX?.signals || window.Nexus?.coordinator?.runtimeContext?.globalSignals?.() || {};
      const txt = (g.chatInputText || '').trim();
      if (!txt) return;
      const sId = g.activeSessionId || 'session-erp';
      const now = new window.Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const senderName = actor || 'Vernon';

      if (g.erpConnected && sId === 'session-erp' && typeof sqlFn === 'function') {
        g.chatInputText = '';
        try {
          await sqlFn(
            'CREATE erp_message SET session_id = $sid, sender = $sender, isAgent = false, time = $time, text = $text, seq = $seq;',
            { sid: sId, sender: senderName, time: timeStr, text: txt, seq: window.Date.now() }
          );
        } catch (err) {
          g.chatInputText = txt;
          if (typeof g.notify === 'function') {
            g.notify('Message Rejected by Server', (err && err.message) ? err.message : 'Insufficient IAM permissions', 'error');
          }
        }
        return;
      }

      const msgs = [...((g.chatMessages || {})[sId] || [])];
      const newMsgId = 'msg-' + window.Date.now();
      msgs.push({
        id: newMsgId,
        sender: senderName,
        isAgent: false,
        time: timeStr,
        text: txt
      });
      g.chatMessages = { ...g.chatMessages, [sId]: msgs };
      g.chatInputText = '';
      if (sId === 'session-copilot' || txt.toLowerCase().includes('@nexus') || txt.toLowerCase().includes('@copilot') || txt.toLowerCase().includes('@finance') || txt.toLowerCase().includes('@agent') || txt.toLowerCase().includes('po') || txt.toLowerCase().includes('status')) {
        setTimeout(() => {
          const curMsgs = [...((g.chatMessages || {})[sId] || [])];
          const isNexus = sId === 'session-copilot' || txt.toLowerCase().includes('@nexus') || txt.toLowerCase().includes('@copilot');
          const agentName = isNexus ? 'Nexus Copilot' : 'Finance Agent';
          curMsgs.push({
            id: 'agent-' + window.Date.now(),
            sender: agentName,
            isAgent: true,
            time: new window.Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            text: isNexus
              ? 'Understood. Processing your request against active Nexus-UX reactive scope and ERP datasets. Operation dispatched successfully.'
              : 'Variance report updated and synchronized with inventory ledger. Purchase order #2026-Q3-088 status: Verified.'
          });
          g.chatMessages = { ...g.chatMessages, [sId]: curMsgs };
        }, 800);
      }
    }
  }"
  class="fixed inset-y-0 end-0 z-40 w-96 max-w-[calc(100vw-2.5rem)] flex flex-row bg-base-100 border-s border-base-300 shadow-2xl transition-transform duration-300 ease-in-out overflow-hidden"
  data-effect="if ($auth.isAuthenticated && $auth.actor) { if (erpSyncedActor !== $auth.actor) { connectErpLive($sql, $auth.actor); } } else if (erpConnected || erpSyncedActor) { disconnectErpLive(); }"
  data-class="{
    'translate-x-0': chatbarOpen,
    'translate-x-full rtl:-translate-x-full': !chatbarOpen,
    'border-s-primary/20': chatbarDocked
  }">

  <!-- 1. Left Start-Rail: Vertical Session Icon Buttons -->
  <div
    class="w-14 shrink-0 bg-base-300/80 backdrop-blur-md border-e border-base-content/10 flex flex-col items-center py-3 gap-2 select-none">
    <!-- New Chat Action on Rail -->
    <div class="tooltip tooltip-right" data-tip="New Chat">
      <button type="button"
        class="btn btn-ghost btn-circle btn-sm hover:bg-base-content/10 text-base-content/70 hover:text-base-content"
        data-on-click="createChatSession()">
        <iconify-icon icon="material-symbols-light:add" class="text-xl"></iconify-icon>
      </button>
    </div>

    <div class="divider my-0.5 w-8 opacity-30"></div>

    <!-- Vertical Rail Session Buttons (Correlate to speed dial sessions, draggable & contextmenu pinnable) -->
    <div class="flex-1 w-full flex flex-col items-center gap-2 overflow-y-auto scrollbar-none"
      data-drag="{ list: 'chatSessions', group: 'chatSessions', direction: 'vertical' }">
      <template data-for="session in (chatSessions || [])">
        <div data-drag-item class="tooltip tooltip-right relative cursor-grab active:cursor-grabbing select-none"
          data-bind-attr-data-tip="session.name + (session.pinned ? ' (Pinned)' : '')"
          data-on-contextmenu_prevent_stop="ctxMenu = { open: true, x: $evt.clientX, y: $evt.clientY, type: 'chatSession', target: session }">
          <button type="button" class="btn btn-ghost btn-circle btn-sm relative transition-all duration-200"
            data-class="{
              'btn-active bg-primary/20 text-primary shadow-sm': activeSessionId === session.id,
              'text-base-content/60 hover:text-base-content hover:bg-base-content/10': activeSessionId !== session.id
            }" data-on-click="openSession(session.id)">
            <iconify-icon data-bind-icon="session.icon" class="text-lg"></iconify-icon>
            <!-- Pin Indicator Badge -->
            <span data-show="session.pinned"
              class="badge badge-xs badge-secondary absolute -top-1 -start-1 size-3 p-0 flex items-center justify-center shadow-xs">
              <iconify-icon icon="material-symbols-light:keep" class="text-[8px]"></iconify-icon>
            </span>
            <!-- Unread Badge -->
            <span data-show="session.unread > 0"
              class="badge badge-xs badge-error absolute -top-0.5 -end-0.5 size-2 rounded-full p-0"></span>
          </button>
        </div>
      </template>
    </div>

    <!-- Bottom Rail: Active Dock Mode Indicator -->
    <div class="tooltip tooltip-right"
      data-bind-attr-data-tip="chatbarDocked ? 'Docked to Layout' : 'Floating Overlay'">
      <div class="size-2 rounded-full transition-colors"
        data-class="{ 'bg-primary animate-pulse': chatbarDocked, 'bg-base-content/30': !chatbarDocked }"></div>
    </div>
  </div>

  <!-- 2. Main Chat Session Body -->
  <div class="flex-1 flex flex-col min-w-0 bg-base-100 overflow-hidden">
    <!-- Header -->
    <div
      class="h-16 px-4 border-b border-base-200 flex items-center justify-between shrink-0 bg-base-100/90 backdrop-blur-sm">
      <div class="flex items-center gap-2.5 min-w-0 flex-1">
        <div class="size-9 rounded-xl bg-primary/10 text-primary flex items-center justify-center shrink-0">
          <iconify-icon data-bind-icon="getActiveSession().icon || 'material-symbols-light:chat'"
            class="text-xl"></iconify-icon>
        </div>
        <div class="min-w-0 flex-1">
          <h3 class="font-semibold text-sm truncate" data-bind="getActiveSession().name || 'Conversation'"></h3>
          <div class="flex items-center gap-1.5 text-xs text-base-content/50 truncate">
            <span class="badge badge-xs badge-primary badge-outline text-[10px]"
              data-bind="getActiveSession().type === 'agent' ? 'AI Copilot' : 'Team Channel'"></span>
            <span data-show="erpConnected && activeSessionId === 'session-erp'"
              id="erp-live-badge"
              class="badge badge-xs badge-success text-[10px] gap-1">Live DB</span>
            <span class="truncate" data-bind="getActiveSession().description || ''"></span>
          </div>
        </div>
      </div>

      <!-- Header Actions: Pin Conversation, Attach/Dock & Close -->
      <div class="flex items-center gap-1 shrink-0">
        <!-- Pin / Unpin Conversation Toggle -->
        <div class="tooltip tooltip-bottom"
          data-bind-attr-data-tip="getActiveSession().pinned ? 'Unpin Conversation' : 'Pin Conversation'">
          <button type="button" class="btn btn-ghost btn-xs btn-circle transition-colors"
            data-class="{ 'text-secondary bg-secondary/10': getActiveSession().pinned, 'opacity-60 hover:opacity-100': !getActiveSession().pinned }"
            data-on-click="togglePinSession(activeSessionId)">
            <iconify-icon
              data-bind-icon="getActiveSession().pinned ? 'material-symbols-light:bookmark' : 'material-symbols-light:bookmark-outline'"
              class="text-lg"></iconify-icon>
          </button>
        </div>

        <!-- Pin / Attach Toggle Button -->
        <div class="tooltip tooltip-bottom"
          data-bind-attr-data-tip="chatbarDocked ? 'Unpin (Float over content)' : 'Attach to Layout (Shift content)'">
          <button type="button" class="btn btn-ghost btn-xs btn-circle transition-colors"
            data-class="{ 'text-primary bg-primary/10': chatbarDocked, 'opacity-60 hover:opacity-100': !chatbarDocked }"
            data-on-click="toggleChatDock()">
            <iconify-icon icon="material-symbols-light:keep" class="text-lg"></iconify-icon>
          </button>
        </div>

        <!-- Close Button (✕) -->
        <button type="button" class="btn btn-ghost btn-xs btn-circle opacity-70 hover:opacity-100"
          aria-label="Close Chatbar" data-on-click="closeChatbar()">
          <iconify-icon icon="material-symbols-light:close" class="text-lg"></iconify-icon>
        </button>
      </div>
    </div>

    <!-- Participants Quick Strip (if group channel) -->
    <div data-show="getActiveSession().members && getActiveSession().members.length > 1"
      class="px-4 py-1.5 bg-base-200/50 border-b border-base-200 text-xs flex items-center gap-2 overflow-x-auto scrollbar-none shrink-0">
      <span class="text-base-content/50 text-[11px] font-medium shrink-0">Members:</span>
      <template data-for="m in (getActiveSession().members || [])">
        <span class="badge badge-sm gap-1 py-1 text-[11px]"
          data-class="{ 'badge-primary badge-outline': m.isAgent, 'badge-ghost': !m.isAgent }">
          <iconify-icon data-show="m.isAgent" icon="material-symbols-light:smart-toy-outline"
            class="text-xs"></iconify-icon>
          <span data-bind="m.name"></span>
        </span>
      </template>
    </div>

    <!-- 3. Message Stream -->
    <div id="chat-message-stream" class="flex-1 p-4 overflow-y-auto space-y-4"
      data-effect="if (chatbarOpen && $el) { const msgs = (chatMessages || {})[activeSessionId]; if (msgs) { $nextTick(() => { $el.scrollTop = $el.scrollHeight; }); } }">
      <template data-for="msg in getActiveMessages()">
        <div class="flex flex-col gap-1 w-full"
          data-class="{ 'items-end': !msg.isAgent && msg.sender === ($auth.actor || 'Vernon'), 'items-start': msg.isAgent || msg.sender !== ($auth.actor || 'Vernon') }">

          <!-- Sender & Time Label -->
          <div class="flex items-center gap-2 text-[11px] text-base-content/50 px-1">
            <span class="font-medium" data-bind="msg.sender"></span>
            <span data-show="msg.isAgent" class="badge badge-xs badge-primary text-[9px] py-0 px-1">AI Agent</span>
            <span data-bind="msg.time"></span>
          </div>

          <!-- Chat Bubble -->
          <div class="rounded-2xl px-3.5 py-2.5 max-w-[88%] text-sm leading-relaxed shadow-sm font-sans" data-class="{
              'bg-primary text-primary-content rounded-br-none': !msg.isAgent && msg.sender === ($auth.actor || 'Vernon'),
              'bg-base-200 text-base-content rounded-bl-none border border-base-300': msg.isAgent || msg.sender !== ($auth.actor || 'Vernon')
            }">
            <p data-bind="msg.text" class="whitespace-pre-wrap"></p>

            <!-- Interactive Artifact Card (if message contains an artifact) -->
            <div data-show="msg.artifact"
              class="mt-2.5 p-3 rounded-xl bg-base-100 text-base-content border border-base-300 shadow-md">
              <div class="flex items-center justify-between pb-2 border-b border-base-200 mb-2">
                <div class="flex items-center gap-1.5 font-semibold text-xs">
                  <iconify-icon icon="material-symbols-light:receipt-long"
                    class="text-primary text-base"></iconify-icon>
                  <span data-bind="msg.artifact?.title"></span>
                </div>
                <span class="badge badge-xs"
                  data-class="{ 'badge-success': msg.artifact?.status === 'Approved', 'badge-warning': msg.artifact?.status !== 'Approved' }"
                  data-bind="msg.artifact?.status"></span>
              </div>

              <!-- Line Items -->
              <div class="space-y-1.5 text-xs">
                <template data-for="item in (msg.artifact?.items || [])">
                  <div class="flex justify-between items-center text-base-content/70">
                    <span><strong data-bind="item.qty + 'x'"></strong> <span data-bind="item.desc"></span></span>
                    <span class="font-mono" data-bind="item.cost"></span>
                  </div>
                </template>
              </div>

              <!-- S3 Attachments & Wasm Receipt -->
              <div data-show="(msg.artifact?.attachments && msg.artifact.attachments.length > 0) || msg.artifact?.receipt_path"
                class="mt-2.5 pt-2 border-t border-base-200 space-y-1">
                <template data-for="att in (msg.artifact?.attachments || [])">
                  <a target="_blank" rel="noopener"
                    data-bind-href="att.path"
                    class="flex items-center justify-between gap-2 text-[11px] px-2 py-1 rounded-lg bg-base-200/70 hover:bg-base-200 text-base-content transition-colors">
                    <span class="flex items-center gap-1.5 truncate">
                      <iconify-icon icon="material-symbols-light:attach-file" class="text-sm text-primary shrink-0"></iconify-icon>
                      <span class="truncate font-medium" data-bind="att.name"></span>
                    </span>
                    <span class="font-mono text-[10px] opacity-60 shrink-0" data-bind="(att.size || 0) + ' B'"></span>
                  </a>
                </template>
                <a data-show="msg.artifact?.receipt_path" target="_blank" rel="noopener"
                  id="po-wasm-receipt-link"
                  data-bind-href="msg.artifact?.receipt_path || '#'"
                  class="flex items-center justify-between gap-2 text-[11px] px-2 py-1 rounded-lg bg-success/10 hover:bg-success/20 text-success transition-colors">
                  <span class="flex items-center gap-1.5 truncate">
                    <iconify-icon icon="material-symbols-light:verified-outline" class="text-sm shrink-0"></iconify-icon>
                    <span class="truncate font-medium">Wasmtime Approval Receipt (S3)</span>
                  </span>
                  <iconify-icon icon="material-symbols-light:open-in-new" class="text-xs shrink-0"></iconify-icon>
                </a>
              </div>

              <!-- Total & Action Buttons -->
              <div class="mt-3 pt-2 border-t border-base-200 flex items-center justify-between gap-2 flex-wrap">
                <span class="text-xs font-semibold">Total: <span class="font-mono text-primary"
                    data-bind="msg.artifact?.amount"></span></span>
                <div class="flex items-center gap-1.5">
                  <label data-show="erpConnected && $auth.can('blob.write')"
                    class="btn btn-xs btn-ghost font-normal cursor-pointer gap-1 px-1.5"
                    title="Attach file to Nexus-IO S3">
                    <iconify-icon icon="material-symbols-light:attach-file" class="text-sm"></iconify-icon>
                    <span>Attach</span>
                    <input id="po-attachment-input" type="file" class="hidden"
                      data-on-change="uploadPoAttachment(msg.artifact?.id || msg.po_id, $el, $sql, $auth.actor)" />
                  </label>
                  <span data-show="msg.artifact?.status === 'Approved' && msg.artifact?.approved_by"
                    class="text-[11px] text-success font-medium"
                    data-bind="'Approved by ' + msg.artifact?.approved_by"></span>
                  <span data-show="msg.artifact?.status !== 'Approved' && $auth.isAuthenticated && !$auth.can('db.write')"
                    class="badge badge-ghost badge-xs text-[10px]">Read-Only</span>
                  <button type="button" class="btn btn-xs btn-primary font-normal"
                    data-show="msg.artifact?.status !== 'Approved' && (!$auth.isAuthenticated || $auth.can('db.write'))"
                    data-on-click="approvePo(msg.artifact?.id || msg.po_id, $sql, $auth.actor)">
                    Approve PO
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- 4. Composer / Input Bar -->
    <div class="p-3 border-t border-base-200 bg-base-100/95 shrink-0">
      <!-- Quick @mention Suggestion Pills -->
      <div class="flex items-center gap-1.5 mb-2 overflow-x-auto scrollbar-none text-[11px]">
        <button type="button"
          class="badge badge-sm badge-ghost gap-1 opacity-70 hover:opacity-100 hover:badge-primary transition-all cursor-pointer"
          data-on-click="chatInputText = (chatInputText ? chatInputText + ' ' : '') + '@Finance Agent '">
          <span>@Finance Agent</span>
        </button>
        <button type="button"
          class="badge badge-sm badge-ghost gap-1 opacity-70 hover:opacity-100 hover:badge-primary transition-all cursor-pointer"
          data-on-click="chatInputText = (chatInputText ? chatInputText + ' ' : '') + '@Nexus Copilot '">
          <span>@Nexus Copilot</span>
        </button>
      </div>

      <div class="flex items-center gap-2">
        <input id="chat-composer-input" type="text"
          class="input input-bordered input-sm flex-1 focus:input-primary text-sm"
          placeholder="Message team or @agent… (Enter to send)" data-bind-value="chatInputText"
          data-effect="if (chatbarOpen && $el) { $nextTick(() => $el.focus()); }"
          data-on-keydown_enter="sendChatMessage($sql, $auth.actor)" />
        <button type="button" class="btn btn-primary btn-sm btn-circle shrink-0" aria-label="Send message"
          data-on-click="sendChatMessage($sql, $auth.actor)">
          <iconify-icon icon="material-symbols-light:send" class="text-lg"></iconify-icon>
        </button>
      </div>
    </div>
  </div>
</aside>
